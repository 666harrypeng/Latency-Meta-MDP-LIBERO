[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "latency-meta-mdp-libero"
version = "0.1.0"
description = "A time-synchronized RoboSuite backend for latency-aware VLA research"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "mujoco==3.3.3",
  "numpy>=1.24,<2",
  "Pillow==12.3.0",
  "PyYAML>=6,<7",
  "robosuite==1.5.2",
  "scipy>=1.11,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/latency_meta_mdp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires local formal artifacts or an isolated external runtime",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
