[project]
name = "metamdp-forecast-preparation"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.7.1", "torchvision==0.22.1", "numpy==1.26.4",
  "Pillow==12.3.0", "PyYAML==6.0.3", "pyarrow==20.0.0",
  "safetensors==0.5.3", "transformers==4.57.6", "huggingface-hub==0.36.2",
  "scipy==1.15.3", "timm==1.0.19", "einops==0.8.1",
  "robosuite==1.5.2", "mujoco==3.3.3",
]
[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
